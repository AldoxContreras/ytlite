name: Build YouTube Plus IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clonar dependencias externas (YouTubeHeader y Protobuf)
        run: |
          git clone https://github.com/Dayanch99/YouTubeHeader.git ../YouTubeHeader || git clone https://github.com/PoomSmart/YouTubeHeader.git ../YouTubeHeader
          git clone https://github.com/protocolbuffers/protobuf.git /tmp/protobuf
          mkdir -p ../protobuf
          mv /tmp/protobuf/objectivec ../protobuf/objectivec

      - name: Instalar Theos y dependencias
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install RootHide Headers
        run: |
          mkdir -p $THEOS/include
          cat << 'EOF' > $THEOS/include/roothide.h
          #ifndef __ROOTHIDE_H__
          #define __ROOTHIDE_H__
          #import <Foundation/Foundation.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          NSString *nscp(NSString *path);
          const char *bootstrap_path(const char *path);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Compilar el tweak (.deb)
        run: |
          make package FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error"

      - name: Descargar IPA base de YouTube
        run: |
          curl -L -f -H "Authorization: token ${{ secrets.GH_TOKEN }}" "${{ secrets.IPA_URL }}" -o YouTube.ipa
          file YouTube.ipa

      - name: Instalar Cyan e inyectar tweak
        run: |
          pip3 install --upgrade https://github.com/asdfzxcvbn/cyan/archive/main.zip
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          cyan -i YouTube.ipa -o YouTubePlus.ipa -f "$DEB_FILE" -u -c -e

      - name: Subir IPA compilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePlus-IPA
          path: YouTubePlus.ipa
